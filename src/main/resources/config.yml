# ========================================================
#            CaciottaCore - Configurazione Principale
#      Plugin per PaperMC con Sistema Home e Autenticazione
# ========================================================

prefix: "&8[&6Caciotta&eCore&8]&r "

# ========================================================
#              FUSO ORARIO DEL SERVER (TIMEZONE)
# ========================================================
# Fuso orario utilizzato per orari, data, scoreboard, moderazione e reset giornalieri.
# Predefinito: "Europe/Rome" (Fuso orario italiano)
timezone: "Europe/Rome"

# ========================================================
#                    SISTEMA HOME
# ========================================================
home:
  # Secondi di attesa prima del teletrasporto (0 per istantaneo)
  teleport-delay: 3
  # Annulla il teletrasporto se il giocatore si muove
  cancel-on-move: true
  # Annulla il teletrasporto se il giocatore subisce danno
  cancel-on-damage: true
  # Numero massimo di home predefinito
  # Puoi dare permessi aggiuntivi: caciottacore.homes.<numero> o caciottacore.homes.unlimited
  default-max-homes: 3
  # Riproduci suono al teletrasporto
  play-sound: true
  # Spawn particelle al teletrasporto
  spawn-particles: true

# ========================================================
#                    SISTEMA WARP
# ========================================================
warp:
  # Secondi di attesa prima del teletrasporto (0 per istantaneo)
  teleport-delay: 3
  # Annulla il teletrasporto se il giocatore si muove
  cancel-on-move: true
  # Annulla il teletrasporto se il giocatore subisce danno
  cancel-on-damage: true
  # Riproduci suono al teletrasporto
  play-sound: true
  # Spawn particelle al teletrasporto
  spawn-particles: true
  # Numero massimo di warp creabili per un giocatore normale (0 o -1 per illimitati)
  # Puoi dare permessi aggiuntivi: caciottacore.warp.max.<numero> o caciottacore.warp.unlimited
  max-warps-per-player: 5

# ========================================================
#                    SISTEMA TPA
# ========================================================
tpa:
  # Durata della richiesta in secondi prima che scada
  timeout-seconds: 60
  # Secondi di attesa prima del teletrasporto (0 per istantaneo)
  teleport-delay: 3
  # Annulla il teletrasporto se il giocatore si muove
  cancel-on-move: true
  # Annulla il teletrasporto se il giocatore subisce danno
  cancel-on-damage: true
  # Riproduci suono al teletrasporto
  play-sound: true
  # Spawn particelle al teletrasporto
  spawn-particles: true

# ========================================================
#              SISTEMA TPBACK (RITORNO MORTE)
# ========================================================
tpback:
  # Tempo massimo in secondi dalla morte entro cui e consentito eseguire /tpback
  timeout-seconds: 30
  # Numero massimo di utilizzi consentiti durante la giornata (giornaliero)
  # E possibile assegnare il permesso 'caciottacore.tpback.unlimited' per utilizzi illimitati
  max-daily-uses: 3
  # Secondi di attesa prima del teletrasporto (0 per istantaneo)
  teleport-delay: 3
  # Annulla il teletrasporto se il giocatore si muove
  cancel-on-move: true
  # Annulla il teletrasporto se il giocatore subisce danno
  cancel-on-damage: true
  # Riproduci suono al teletrasporto
  play-sound: true
  # Spawn particelle al teletrasporto
  spawn-particles: true
  # Invia notifica informativa cliccabile al giocatore alla morte con il comando /tpback
  notify-on-death: true

# ========================================================
#            SISTEMA RTP (RANDOM TELEPORT)
# ========================================================
rtp:
  # Abilita o disabilita il comando /rtp
  enabled: true
  # Raggio minimo dal centro (blocchi)
  min-radius: 500
  # Raggio massimo dal centro (blocchi)
  max-radius: 5000
  # Coordinata X del centro della mappa (default: 0)
  center-x: 0
  # Coordinata Z del centro della mappa (default: 0)
  center-z: 0
  # Secondi di attesa prima del teletrasporto (0 per istantaneo)
  teleport-delay: 3
  # Annulla il teletrasporto se il giocatore si muove
  cancel-on-move: true
  # Annulla il teletrasporto se il giocatore subisce danno
  cancel-on-damage: true
  # Riproduci suono al teletrasporto
  play-sound: true
  # Spawn particelle al teletrasporto
  spawn-particles: true
  # Numero massimo di tentativi di generazione chunk per trovare un punto sicuro
  max-attempts: 15
  # Mondi in cui e consentito eseguire il comando /rtp
  allowed-worlds:
    - "world"

# ========================================================
#            SISTEMA CESTINO COMUNE (TRASH BIN)
# ========================================================
cestino:
  # Abilita o disabilita il comando /cestino
  enabled: true
  # Numero di righe del cestino comune (da 1 a 6 righe, default: 6 = 54 slot)
  rows: 6
  # Intervallo in minuti per lo svuotamento automatico (default: 15 minuti)
  reset-interval-minutes: 15
  # Titolo dell'inventario del cestino comune (supporta codici colore)
  title: "&8🗑 &6Cestino Comune &7(Reset 15m)"
  # Invia un annuncio globale in chat quando il cestino viene svuotato
  broadcast-on-clear: true
  # Riproduci suoni all'apertura, chiusura e svuotamento del cestino
  play-sound: true
  # Blocca l'inserimento di shulker box nel cestino
  disallow-shulker-boxes: false

# ========================================================
#                    SISTEMA ZAINO (BAG)
# ========================================================
bag:
  # Abilita o disabilita il comando /bag
  enabled: true
  # Numero di righe predefinito dello zaino (da 1 a 6 righe, 9-54 slot)
  # I giocatori possono avere piu righe con i permessi: caciottacore.bag.rows.<1-6>
  default-rows: 3
  # Titolo dell'inventario dello zaino personale (supporta {player} e codici colore)
  title: "&8Zaino Personale &7({player})"
  # Titolo dell'inventario in modalita ispezione staff
  title-admin: "&4Ispezione Zaino &8- &c{player}"
  # Riproduci suoni all'apertura e chiusura dello zaino
  play-sound: true
  sound-open: "ITEM_BUNDLE_DROP_CONTENTS"
  sound-close: "ITEM_BUNDLE_REMOVE_ONE"
  # Blocca l'inserimento di shulker box nello zaino per evitare storage infinito o bug NBT
  disallow-shulker-boxes: false

# ========================================================
#             SISTEMA ISPEZIONE INVENTARI (INVSEE)
# ========================================================
invsee:
  # Abilita o disabilita il comando /invsee
  enabled: true
  # Titolo dell'inventario in modalita ispezione staff (supporta {player} e codici colore)
  title: "&8Inventario &7({player})"
  # Consente allo staff di modificare direttamente l'inventario del giocatore
  # Se false, l'inventario viene aperto in sola visualizzazione (sola lettura)
  allow-modification: true
  # Riproduci suoni all'apertura dell'inventario o dell'Ender Chest
  play-sound: true
  # Blocca l'ispezione di utenti con permessi di immunita (caciottacore.invsee.exempt) a meno che lo staffer sia OP
  prevent-inspect-exempt: true

# ========================================================
#                    SISTEMA SONNO (SLEEP)
# ========================================================
sleep:
  # Abilita o disabilita il sistema del sonno personalizzato
  enabled: true
  # Tick di inizio notte in cui e consentito dormire (default vanilla: 12542, circa 18:30)
  start-tick: 12542
  # Tick di fine notte (default vanilla: 23460, circa 05:45)
  end-tick: 23460
  # Invia annuncio globale in chat con pulsante cliccabile all'inizio della notte
  broadcast-on-night: true
  # Invia annuncio globale in chat con pulsante cliccabile all'inizio di un temporale
  broadcast-on-thunder: true
  # Consente di passare la notte se uno o piu giocatori dormono
  night-skip-enabled: true
  # Secondi di attesa nel sonno prima di passare la notte
  night-skip-delay-seconds: 4
  # Se true, basta 1 solo giocatore che dorme per passare la notte
  # Se false, richiede che tutti i giocatori online nell'Overworld dormano
  single-player-sleep: false
  # Resetta la statistica dei Phantom (tempo dall'ultimo riposo) quando si dorme
  reset-phantom-statistic: true
  # Pulisce la pioggia e il temporale al passaggio della notte
  clear-weather-on-skip: true
  # Controlla la presenza di mostri aggressivi nelle vicinanze prima di dormire
  check-monsters-nearby: true
  # Raggio di controllo dei mostri in blocchi (orizzontale)
  monster-check-radius: 8
  # Riproduci suoni al broadcast e al passaggio della notte
  play-sound: true

# ========================================================
#                    SISTEMA AFK
# ========================================================
afk:
  # Abilita o disabilita il comando /afk
  enabled: true
  # Invia annuncio globale in chat quando un giocatore entra o esce dall'AFK
  broadcast: true
  # Riproduci suoni all'entrata e all'uscita dall'AFK
  play-sound: true
  # Titolo fisso mostrato a schermo intero durante l'AFK
  title: "&c&lSEI AFK"
  # Sottotitolo mostrato sotto il titolo durante l'AFK
  subtitle: "&eUna piccola pausa ci vuole"
  # Suffisso mostrato nella lista tab (Tablist) per i giocatori in AFK
  tab-suffix: " &7[&cAFK&7]"

# ========================================================
#                SISTEMA AUTENTICAZIONE
# ========================================================
auth:
  # Lunghezza minima e massima della password
  min-password-length: 4
  max-password-length: 32

  # Tempo massimo in secondi per registrarsi o accedere prima di essere espulsi
  timeout-seconds: 60

  # Intervallo in secondi tra i messaggi di sollecito in chat/actionbar
  reminder-interval-seconds: 4

  # Numero massimo di tentativi di password errata prima dell'espulsione
  max-login-attempts: 3

  # Effetti applicati al giocatore prima dell'autenticazione (cecità e lentezza per evitare esplorazione)
  effects:
    blindness: true
    slowness: true

  # Sessione IP in minuti (se un utente rientra dallo stesso IP entro questi minuti, viene autenticato automaticamente)
  # Imposta 0 per richiedere sempre la password
  session-timeout-minutes: 10

# ========================================================
#                  SISTEMA SCOREBOARD
# ========================================================
scoreboard:
  # Abilita o disabilita la scoreboard laterale
  enabled: true

  # Intervallo di aggiornamento delle statistiche in tick (20 tick = 1 secondo)
  update-interval-ticks: 20

  # Mostra o nasconde i numeri rossi sul bordo destro della scoreboard
  show-numbers: false

  # Titolo statico della scoreboard (supporta codici colore & e hex)
  title: "&6&lCACIOTTA &e&lCORE"

  # Animazione del titolo (cicla tra i frame nell'intervallo specificato)
  animated-title:
    enabled: true
    interval-ticks: 10
    frames:
      - "&6&lCACIOTTA &e&lCORE"
      - "&e&lCACIOTTA &6&lCORE"
      - "&f&lCACIOTTA &e&lCORE"
      - "&e&lCACIOTTA &6&lCORE"

  # Righe della scoreboard (massimo 15 righe per limiti Minecraft).
  # Placeholder disponibili:
  #   {player}          - Nome del giocatore
  #   {rank}            - Grado del giocatore (&cAdmin, &6Mod, &aVIP, &7Utente)
  #   {rank_prefix}     - Prefisso del grado del giocatore
  #   {x}               - Coordinata X (blocco)
  #   {y}               - Coordinata Y (blocco)
  #   {z}               - Coordinata Z (blocco)
  #   {coords}          - Coordinate formattate (X, Y, Z)
  #   {direction}       - Direzione verso cui guarda (Nord, Sud, Est, Ovest)
  #   {direction_short} - Direzione abbreviata (N, S, E, W)
  #   {online}          - Giocatori attualmente online
  #   {max_online}      - Numero massimo di giocatori
  #   {ping}            - Ping (latenza) in millisecondi
  #   {kills}           - Uccisioni totali (PvP)
  #   {deaths}          - Morti totali
  #   {mob_kills}       - Mostri/mob uccisi
  #   {kdr}             - Rapporto K/D (Kill/Death)
  #   {world}           - Nome del mondo attuale
  #   {level}           - Livello di esperienza
  #   {health}          - Vita attuale del giocatore
  #   {max_health}      - Vita massima del giocatore
  #   {homes}           - Home salvate dal giocatore
  #   {max_homes}       - Limite massimo di home del giocatore
  #   {status}          - Stato autenticazione (&aAutenticato / &cNon Autenticato)
  #   {date}            - Data odierna (GG/MM/AAAA)
  #   {time}            - Ora attuale (HH:mm)
  #   {event_name}      - Nome dell'evento a premi attivo o programmato
  #   {event_status}    - Stato dell'evento (&eIn attesa, &aIn corso, &cTerminato)
  #   {event_start}     - Data/ora di inizio programmata dell'evento
  #   {event_target}    - Obbiettivo da raggiungere (es. 10.000)
  #   {event_participants} - Numero di partecipanti confermati
  #   {event_blocks_broken} - Blocchi distrutti totali da tutti i partecipanti
  #   {event_placeholders_blocks} - Placeholder per blocchi totali
  #   {event_top_1_name} - Nome del 1° classificato
  #   {event_top_2_name} - Nome del 2° classificato
  #   {event_top_3_name} - Nome del 3° classificato
  #   {event_top_1_score} - Punteggio del 1° classificato
  #   {event_top_2_score} - Punteggio del 2° classificato
  #   {event_top_3_score} - Punteggio del 3° classificato
  #   {event_top_1}     - Primo classificato formattato (Nome - Punteggio)
  #   {event_top_2}     - Secondo classificato formattato
  #   {event_top_3}     - Terzo classificato formattato
  #   {event_player_progress} - Progresso personale del giocatore
  #   {event_player_score} - Punteggio personale (blocchi scavati) del giocatore
  #   {event_player_rank}  - Posizione personale in classifica (1°, 2°, 3°, ...)
  #   {event_player_remaining} - Blocchi rimanenti al completamento
  #   {event_player_percent}   - Percentuale di completamento dell'obbiettivo
  #   {event_player_confirmed} - Stato conferma del giocatore (&aConfermato / &cNon Iscritto)
  #   {event_timer}     - Countdown automatico all'avvio o alla chiusura (es. 01g 04h 30m o In corso)
  lines:
    - "&7&m-------------------"
    - "&eUtente: &f{player}"
    - "&eGrado: {rank}"
    - " &8» &7Pos: &a{x}&7, &a{y}&7, &a{z} &8(&e{direction_short}&8)"
    - ""
    - "&6&lPvP:"
    - " &8» &fKill: &a{kills} &7| &fMorti: &c{deaths}"
    - " &8» &fK/D: &e{kdr}"
    - ""
    - "&6&lServer:"
    - " &8» &fOnline: &b{online}&7/&b{max_online}"
    - " &8» &fPing: &a{ping}ms"
    - " &8» &fHome: &6{homes}&7/&6{max_homes}"
    - ""
    - "&emc.caciotta.it"

  # Scoreboard speciale per gli eventi a premi (attiva in tempo reale durante un evento in corso)
  event-scoreboard:
    # Abilita la seconda scoreboard dinamica quando un evento a premi e in corso
    enabled: true
    # Titolo della scoreboard durante l'evento
    title: "&6&lEVENTO &e&lSCAVATORE"
    # Se true, mostra questa scoreboard solo ai giocatori che hanno confermato la partecipazione.
    # Se false, la mostra a tutti i giocatori online durante l'evento.
    only-participants: false
    # Righe mostrate in tempo reale durante l'evento
    lines:
      - "&7&m-------------------"
      - "&6&lEvento: &e{event_name}"
      - "&7Obbiettivo: &a{event_target} blocchi"
      - ""
      - "&eIl tuo progresso:"
      - " &8» &fScavati: &e{event_player_score}&7/&a{event_target}"
      - " &8» &fStato: {event_player_confirmed}"
      - ""
      - "&6&lClassifica Podio:"
      - " &8» &e1°: {event_top_1}"
      - " &8» &f2°: {event_top_2}"
      - " &8» &73°: {event_top_3}"
      - ""
      - "&emc.caciotta.it"

# ========================================================
#                    SISTEMA SIT
# ========================================================
sit:
  # Abilita o disabilita il comando /sit
  enabled: true
  # Permette di sedersi cliccando con il tasto destro su scale e gradini (slabs)
  click-to-sit: true
  # Richiede di avere la mano vuota per sedersi cliccando sui blocchi
  require-empty-hand: true
  # Invia il messaggio nella actionbar anziche intasare la chat
  use-actionbar: true

# ========================================================
#                  SISTEMA BROADCAST
# ========================================================
broadcast:
  # Riproduci un suono di avviso a tutti i giocatori quando viene inviato un annuncio
  play-sound: true
  sound: "BLOCK_NOTE_BLOCK_PLING"
  # Prefisso per broadcast inline semplice (quando fancy-banner e false)
  prefix: "&8[&4&lANNUNCIO&8]&r "
  # Se true, invia l'annuncio chat con un banner decorativo multiriga
  fancy-banner: true
  banner-header: "&8&m----------------------------------------"
  banner-title: "        &c&l📢 ANNUNCIO DELLO STAFF"
  banner-footer: "&8&m----------------------------------------"

